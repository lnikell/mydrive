[package]
name = "nas-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
smb2 = "=0.31.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
libc = "0.2"
zeroize = { version = "1", features = ["serde"] }
thiserror = "2"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
async-trait = "0.1"

[profile.release]
lto = "thin"
strip = true
