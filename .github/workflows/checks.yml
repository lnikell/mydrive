name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the tested Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy
      - name: Test core, macOS adapters, release guards and transport
        env:
          RUSTUP_TOOLCHAIN: 1.93.0
        run: bash tools/check.sh
      - name: Build the development bundle
        env:
          RUSTUP_TOOLCHAIN: 1.93.0
        run: bash tools/build-macos.sh
